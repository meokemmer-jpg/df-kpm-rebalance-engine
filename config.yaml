# DF-KPM-Rebalance-Engine Configuration [CRUX-MK]
# Welle-42 Foundation-DF: KPM Variante-D-Hybrid
# Per ~/.claude/rules/kpm-sizing.md
df_id: df-kpm-rebalance-engine
df_name: KPM-Rebalance-Engine
welle_introduced: welle-42
type: foundation-df
version: 0.1.0-PHASE-1
status: PHASE-1-SCAFFOLD
crux-mk: true

default_action:
  description: "KPM Rebalance-Empfehlungs-Engine (Variante-D Hybrid) - berechnet Soll-Allokation Kapital/Asset-Klassen pro Familienmitglied + Drawdown-Caps + Rebalance-Vorschlag (Empfehlungs-only, KEIN Auto-Execute)"
  rho_per_run_eur: 250
  rho_validation_source: unvalidated
  block_gates:
    - gate_id: K13_PAV
      block_reason: "Pre-Action-Verification PFLICHT bei K_0-Direct: env_tag (Sandbox-Default Pflicht) + Variante-D-Drawdown-Caps + Mock-Familie-Default + KEIN-Auto-Execute"
      false_block_cost_eur: 180
      legitimate_block_condition: "Production-Mode ohne PHRONESIS_TICKET Martin ODER Auto-Execute-Attempt (verboten) ODER Variante-D-Drawdown-Cap-Verletzung"
    - gate_id: K11
      block_reason: "Cascade-Containment: Engine-Fail darf KEINE anderen KPM-DFs (Family-Distribution) beeinflussen"
      false_block_cost_eur: 100
      legitimate_block_condition: "Engine-Crash ODER Real-Market-Data-Feed down (dann Mock-Fallback)"
    - gate_id: K16
      block_reason: "Concurrent-Spawn auf KPM-State-OUT_DIR verhindert (Race-Condition bei Rebalance-State)"
      false_block_cost_eur: 80
      legitimate_block_condition: "Lock-File jünger als 6h existiert + andere KPM-Engine-PID via pgrep detected"
  graceful_degradation_path: "Sandbox-Empfehlungs-only-Mode mit Mock-Familie + Mock-Markt-Daten (KEIN Real-Capital-Touch)"

k0_touch: true
k0_caveats:
  - "Familien-Vermoegen Direct-Berührung (Empfehlungs-only)"
  - "Variante-D Drawdown-Caps Pflicht"
  - "Cross-LLM-3OF3 + Martin-Phronesis pro Real-Mode-Aktivieren"
  - "KEINE Real-Trade-Execution, nur Recommendations"

phronesis_required: true
sandbox_default: true

description: |
  Bayesian-Yield-Manager fuer KPM-Rebalance-Decisions.
  Kelly-Fraction-Calculator + Anti-Drawdown-Soft-Brake.
  Konsens-Check mit Variante-D-Limits (15/20/25%).
  Sandbox-Default mit Mock-Recommendations.

cascade_isolation: hard
failure_blast_radius: 1
output_feeds_into_training: false
external_anchor_type: market_data_feed
concurrent_spawn_protection: both
lock_dir: /tmp/df-kpm-rebalance-engine.lock

tier_2_check:
  lambda_per_month_estimate: 30
  narrow_scope: "Bayesian-Yield-Manager + Kelly-Calc + Drawdown-Cap-Check + Recommendation-Output"
  determinism: 0.85
  rollback_seconds: 30
  test_coverage_target: 0.85
  k0_protected: true
  q0_measurable: true
  escalation_after_n_fails: 3
  rho_budget_eur_day: 0
  audit_trail: branch-hub/audit/df-kpm-rebalance-engine.jsonl

k11_cascade_containment:
  cascade_isolation: hard
  failure_blast_radius: 1
  dependency_dlq_strategy: "Mock-Fallback bei Real-API-Failure; Recommendation-DLQ append-only"

k12_distillation_resistenz:
  output_feeds_into_training: false
  provenance_required_in_output: true
  non_llm_validation_layer: rule-based-recommendation-validator

k13_independent_ground_truth:
  external_anchor_type: market_data_feed
  external_anchor_validation_frequency: "daily 06:00 NAV + Recommendation-Generation"
  pre_action_domain_check:
    env_tag: "sandbox/dev/staging/prod check"
    mount_point: "sqlite-db Path"
    network_region: "Market-Data-Endpoints fixed list"
  pre_action_backup_check:
    backup_status: "previous Recommendation noch konsistent?"
    replication_lag: "n/a"
  pre_action_blast_radius_check:
    blast_radius: "ein Daily-Recommendation-Set"
    reversibility_class: "state-only (Recommendation-Historie append-only)"

k14_human_override_decay:
  override_complexity: single_command
  override_documentation_freshness_days: 30
  martin_review_cadence: "weekly Recommendation-Audit + monthly Variante-D-Compliance"
  bus_factor_handover_drilled: false

k15_entropy_budget:
  entropy_added_loc_estimate: 1000
  entropy_added_concepts:
    - RebalanceRecommendation
    - BayesianYieldEstimator
    - KellyFractionCalculator
    - DrawdownSoftBrakeAction
    - ConsensusCheckResult
  entropy_justified_by_rho: "+EUR 50k/Jahr durch konsistente Variante-D-Compliance + Martin-Bandbreite-Save"
  entropy_subtractive_potential: "ersetzt manuelle Excel-Rebalance-Berechnungen + Variante-D-Mental-Math"

k16_concurrent_spawn_mutex:
  concurrent_spawn_protection: both
  lock_dir: /tmp/df-kpm-rebalance-engine.lock
  lock_stale_age_h: 6
  engine_pgrep_check: true
  lock_release_on: EXIT_INT_TERM

lose_coupling:
  LC1_graceful_degradation:
    degradation_modes:
      - full
      - degraded_no_market_data
      - sandbox_mock
    degradation_test_required: true
  LC2_direct_mode:
    direct_mode_available: true
    direct_mode_capability: 0.7
    direct_mode_trigger: "market_data_feed unreachable >30s OR Phronesis-Ticket missing"
  LC3_circuit_breaker:
    circuit_breaker_timeout_s: 30
    circuit_breaker_open_threshold: 3
    circuit_breaker_half_open_test_interval_s: 300
  LC4_failure_isolation:
    state_externalization: true
    idempotent_operations: true
    dependency_dlq_separate: true
  LC5_health_check:
    health_check_dependencies: [market_data_feed]
    health_check_degraded_score: 0.6
    health_check_endpoint_or_file: "/tmp/df-kpm-rebalance-engine-health.json"

operations:
  output_path: ~/Projects/dark-factories/df-kpm-rebalance-engine/
  sqlite_db_path: ~/.df-kpm-rebalance-engine/state.db
  jsonl_backup_path: branch-hub/audit/df-kpm-rebalance-engine.jsonl
  stop_flag_path: /tmp/df-kpm-rebalance-engine.stop
  health_file_path: /tmp/df-kpm-rebalance-engine-health.json

env_vars:
  DF_KPM_REBALANCE_REAL_ENABLED:
    default: false
    description: "Real-Mode (true=live recommendations, default=mock)"
  PHRONESIS_TICKET:
    required_when: DF_KPM_REBALANCE_REAL_ENABLED=true

rho_estimate:
  annual_eur: 50000
  reason: "Konsistente Variante-D-Compliance-Empfehlungen + Martin-Bandbreite-Save"
  schwer_quantifizierbar: false

dependencies_phase_2:
  - df-kpm-portfolio-tracker
  - df-kpm-drawdown-monitor

crux_bindung:
  K_0: "MAXIMAL geschuetzt (Empfehlungs-only, KEINE Trade-Execution, Sandbox-Default)"
  Q_0: "Konsistente Variante-D-Recommendations"
  I_min: "Strukturierte Bayesian-Decision-Logic + Kelly-Calc"
  W_0: "Martin-Bandbreite minimiert via Pre-Computed-Recommendations"
K13_external_anchor_type: verified_web_sources
K13_external_anchor_validation_frequency: per_anchor_run
K13_external_anchor_count: 2
K13_external_anchor_evidence: https://www.bundesbank.de/de/aufgaben/geldpolitik/zinssaetze/zinssaetze-604558
K13_anchored_ts: 2026-06-23T16:28:59.955756+00:00
